plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

repositories {
	maven { url = "https://maven.terraformersmc.com/releases/" }
}

base {
	archivesName = project.archives_base_name
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"bedrock_compat" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

fabricApi {
	configureTests {
		createSourceSet = true
		modId = 'bedrock_compat_test'
		enableGameTests = false
		enableClientGameTests = true
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	clientCompileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
	clientRuntimeOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
	// Optional local interoperability test jars; never bundled into the published mod.
	if (providers.gradleProperty('nativeEntityCompatibilityMods').isPresent()) {
		clientRuntimeOnly files(providers.gradleProperty('nativeEntityCompatibilityMods').get().split(java.io.File.pathSeparator))
	}

	testImplementation platform('org.junit:junit-bom:5.12.2')
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

processResources {
	inputs.property 'version', project.version
	filesMatching('fabric.mod.json') {
		expand 'version': inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	options.release = 25
}

test {
	useJUnitPlatform()
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}
