plugins {
	id 'net.fabricmc.fabric-loom'
}

version = project.eef_version
group = project.maven_group

base {
	archivesName = 'entity-event-features'
}

repositories {
	maven { url = "https://maven.terraformersmc.com/releases/" }
}

loom {
	splitEnvironmentSourceSets()
	mods {
		"entity_event_features" {
			sourceSet sourceSets.main
			 sourceSet sourceSets.client
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	clientCompileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
	clientRuntimeOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
	testImplementation platform('org.junit:junit-bom:5.12.2')
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
	useJUnitPlatform()
}

processResources {
	inputs.property 'version', project.version
	filesMatching('fabric.mod.json') { expand 'version': inputs.properties.version }
}

tasks.withType(JavaCompile).configureEach {
	options.release = 25
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}
